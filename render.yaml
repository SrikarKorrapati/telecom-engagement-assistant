# One protected demo instance. Paid plans keep the app, database and policy disk available.
services:
  - type: web
    name: telecom-engagement-demo
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    branch: codex/render-deployment
    numInstances: 1
    buildCommand: pip install -r requirements-render.txt
    startCommand: bash scripts/start_render.sh
    healthCheckPath: /_stcore/health
    autoDeployTrigger: "off"
    disk:
      name: telecom-policy-data
      mountPath: /var/data/telecom
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: telecom-engagement-db
          property: connectionString
      - key: POLICY_DATA_DIR
        value: /var/data/telecom/policies
      - key: REQUIRE_DEMO_LOGIN
        value: "true"
      - key: DEMO_ACCESS_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: OPENAI_REASONING_EFFORT
        value: high
databases:
  - name: telecom-engagement-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: telecom_demo
    user: telecom
    diskSizeGB: 1
    ipAllowList: []
